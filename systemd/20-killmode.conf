# Drop-in for claude-rc@.service (and any other unit that runs slot-run).
#
# All slots share ONE tmux server, and that server lives in the cgroup of
# whichever slot unit started it first. With the default KillMode=control-group,
# stopping or restarting that one unit kills the tmux server and with it every
# other slot. With KillMode=process systemd only signals slot-run, whose trap
# (and ExecStopPost) close just this slot's tmux session.
#
# Install as:
#   ~/.config/systemd/user/claude-rc@.service.d/20-killmode.conf   (user units)
#   /etc/systemd/system/claude-rc@.service.d/20-killmode.conf      (system units)
[Service]
KillMode=process
